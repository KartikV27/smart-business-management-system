<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <h2>Smart POS</h2>
      <p>{{ isRegisterMode ? 'Create a new account' : 'Sign in to your account' }}</p>
    </div>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>
    
    <div *ngIf="successMessage" class="success-alert" style="color: green; margin-bottom: 1rem; text-align: center;">
      {{ successMessage }}
    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="!isRegisterMode" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" placeholder="Enter your username" class="form-control" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter your password" class="form-control" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid">Sign In</button>
    </form>

    <!-- REGISTER FORM -->
    <form *ngIf="isRegisterMode" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" formControlName="username" placeholder="Choose a username" class="form-control" />
      </div>
      
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" formControlName="email" placeholder="Enter your email" class="form-control" />
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" formControlName="password" placeholder="Choose a password" class="form-control" />
      </div>
      
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" formControlName="role" class="form-control" style="background-color: #333; color: white;">
          <option value="USER">User (Cashier)</option>
          <option value="ADMIN">Admin (Manager)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="registerForm.invalid">Sign Up</button>
    </form>

    <div class="setup-area" style="margin-top: 1.5rem; border-top: 1px solid #444; padding-top: 1rem;">
      <p style="margin-bottom: 10px;">
        {{ isRegisterMode ? 'Already have an account?' : 'Don\'t have an account?' }}
      </p>
      <button class="btn btn-secondary btn-sm" (click)="toggleMode()" style="width: 100%; margin-bottom: 1rem;">
        {{ isRegisterMode ? 'Back to Sign In' : 'Create an Account' }}
      </button>
      
      <p *ngIf="!isRegisterMode" style="margin-top: 1rem;">First time running the system?</p>
      <button *ngIf="!isRegisterMode" class="btn btn-secondary btn-sm" (click)="setupDatabase()">
        Initialize Database
      </button>
    </div>
  </div>
</div>
